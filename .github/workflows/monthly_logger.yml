name: Monthly Energy Logger

on:
  schedule:
    - cron: '0 8 1 * *' # Runs automatically at 08:00 UTC on the 1st of every month
  workflow_dispatch: # Allows you to manually trigger it anytime for testing

jobs:
  log-energy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install pyemvue requests pandas

      - name: Run monthly logger script
        env:
          EMPORIA_USERNAME: ${{ secrets.EMPORIA_USERNAME }}
          EMPORIA_PASSWORD: ${{ secrets.EMPORIA_PASSWORD }}
          GOOGLE_SCRIPT_URL: ${{ secrets.GOOGLE_SCRIPT_URL }}
        run: |
          python auto_logger.py
